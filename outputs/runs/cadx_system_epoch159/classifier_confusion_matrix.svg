<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="zeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="30" y="25" width="860" height="75" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <text x="55" y="60" fill="url(#headerGrad)" font-size="22" font-weight="700">Stage 1 Classifier — Image-Level Confusion Matrix</text>
  <text x="55" y="84" fill="#94a3b8" font-size="13">Model: Swin Transformer V2-Tiny (swinv2_cr_tiny_ns_224) | BRISC 2025 Test Set (1,000 Slices) | Threshold = 0.40</text>

  <!-- Main Matrix Outer Box -->
  <g transform="translate(40, 125)">
    <!-- Column Headers (Predicted) -->
    <text x="280" y="0" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">DỰ ĐOÁN (PREDICTED)</text>
    <text x="180" y="26" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">Âm tính (Não lành)</text>
    <text x="380" y="26" text-anchor="middle" fill="#f43f5e" font-size="13" font-weight="600">Dương tính (Có u)</text>

    <!-- Row Headers (Actual) -->
    <g transform="translate(-15, 235) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">THỰC TẾ (ACTUAL)</text>
    </g>

    <!-- Row Label 1: Actual Negative -->
    <text x="65" y="125" text-anchor="end" fill="#38bdf8" font-size="13" font-weight="600">Não lành</text>
    <text x="65" y="145" text-anchor="end" fill="#64748b" font-size="11">(140 ảnh)</text>

    <!-- Row Label 2: Actual Positive -->
    <text x="65" y="305" text-anchor="end" fill="#f43f5e" font-size="13" font-weight="600">Có u não</text>
    <text x="65" y="325" text-anchor="end" fill="#64748b" font-size="11">(860 ảnh)</text>

    <!-- Cell [0, 0] : TN -->
    <rect x="90" y="45" width="180" height="160" rx="10" fill="url(#tnGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="75" fill="#a7f3d0" font-size="13" font-weight="700">TN (True Negative)</text>
    <text x="180" y="140" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800">140</text>
    <text x="180" y="175" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">100.0% Đặc hiệu</text>

    <!-- Cell [0, 1] : FP -->
    <rect x="290" y="45" width="180" height="160" rx="10" fill="url(#zeroGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="310" y="75" fill="#94a3b8" font-size="13" font-weight="700">FP (False Positive)</text>
    <text x="380" y="140" text-anchor="middle" fill="#64748b" font-size="44" font-weight="800">0</text>
    <text x="380" y="175" text-anchor="middle" fill="#94a3b8" font-size="13">0.0% Dương tính giả</text>

    <!-- Cell [1, 0] : FN -->
    <rect x="90" y="225" width="180" height="160" rx="10" fill="url(#zeroGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="255" fill="#94a3b8" font-size="13" font-weight="700">FN (False Negative)</text>
    <text x="180" y="320" text-anchor="middle" fill="#64748b" font-size="44" font-weight="800">0</text>
    <text x="180" y="355" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">FN = 0 (An toàn tuyệt đối)</text>

    <!-- Cell [1, 1] : TP -->
    <rect x="290" y="225" width="180" height="160" rx="10" fill="url(#tpGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="310" y="255" fill="#bfdbfe" font-size="13" font-weight="700">TP (True Positive)</text>
    <text x="380" y="320" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800">860</text>
    <text x="380" y="355" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">100.0% Độ nhạy (Recall)</text>
  </g>

  <!-- Side Metrics Panel -->
  <g transform="translate(540, 125)">
    <rect x="0" y="20" width="350" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="25" y="55" fill="#f8fafc" font-size="17" font-weight="700">Chỉ Số Đánh Giá Lâm Sàng</text>
    <line x1="25" y1="68" x2="325" y2="68" stroke="#334155" stroke-width="1.5"/>

    <!-- Accuracy -->
    <g transform="translate(25, 85)">
      <text x="0" y="16" fill="#94a3b8" font-size="13">Độ chính xác tổng (Accuracy)</text>
      <text x="300" y="16" text-anchor="end" fill="#10b981" font-size="16" font-weight="800">100.0%</text>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Sensitivity / Recall -->
    <g transform="translate(25, 140)">
      <text x="0" y="16" fill="#94a3b8" font-size="13">Độ nhạy (Sensitivity / Recall)</text>
      <text x="300" y="16" text-anchor="end" fill="#38bdf8" font-size="16" font-weight="800">100.0%</text>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#38bdf8"/>
    </g>

    <!-- Specificity -->
    <g transform="translate(25, 195)">
      <text x="0" y="16" fill="#94a3b8" font-size="13">Độ đặc hiệu (Specificity)</text>
      <text x="300" y="16" text-anchor="end" fill="#a855f7" font-size="16" font-weight="800">100.0%</text>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#a855f7"/>
    </g>

    <!-- Precision / PPV -->
    <g transform="translate(25, 250)">
      <text x="0" y="16" fill="#94a3b8" font-size="13">Độ chuẩn xác (Precision / PPV)</text>
      <text x="300" y="16" text-anchor="end" fill="#f59e0b" font-size="16" font-weight="800">100.0%</text>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#f59e0b"/>
    </g>

    <!-- F1 Score -->
    <g transform="translate(25, 305)">
      <text x="0" y="16" fill="#94a3b8" font-size="13">Điểm F1-Score</text>
      <text x="300" y="16" text-anchor="end" fill="#06b6d4" font-size="16" font-weight="800">1.0000</text>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="26" width="300" height="6" rx="3" fill="#06b6d4"/>
    </g>

    <!-- Clinical Highlights Badge -->
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="310" height="65" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="12" y="22" fill="#6ee7b7" font-size="12" font-weight="700">Ý NGHĨA LÂM SÀNG:</text>
      <text x="12" y="40" fill="#a7f3d0" font-size="11">• Không bỏ sót u: FN = 0 / 860 lát cắt có u.</text>
      <text x="12" y="55" fill="#a7f3d0" font-size="11">• Tiết kiệm 100% thời gian phân đoạn cho não lành.</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="460" y="595" text-anchor="middle" fill="#64748b" font-size="12">Brain Tumor CADx System | Swin V2-Tiny (27.57M params) + Swin Hybrid (38.80M params)</text>
</svg>

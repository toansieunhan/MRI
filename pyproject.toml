[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-swin-hybrid"
version = "0.1.0"
description = "Swin Hybrid brain tumor segmentation with nnU-Net and a Rust inference CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Tran Manh Hung"},
  {name = "Nguyen Phuoc Toan"},
  {name = "Nguyen Huu Tuan Phat"},
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.17", "onnxruntime>=1.22,<2"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.*pkg_resources.*:DeprecationWarning"]
